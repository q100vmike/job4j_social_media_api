post:
  summary: Принять предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - offer_id
          properties:
            offer_id:
              type: integer
              format: int64
              example: 1
  responses:
    '200':
      description: Предложение дружбы принято (статус → ACCEPTED), создана подписка
    '400':
      description: Некорректные входные данные
    '404':
      description: Пользователь не найден
    '409':
      description: Заявка не в статусе PENDING
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: OFFER_FRIENDSHIP_WRONG_STATUS
              message:
                type: string
                example: Заявка не в статусе PENDING