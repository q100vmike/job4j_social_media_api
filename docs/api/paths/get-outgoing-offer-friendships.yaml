get:
  summary: Получить исходящие предложения дружбы
  parameters:
    - name: id
      in: query
      required: true
      schema:
        type: integer
        format: int64
        example: 1
  responses:
    '200':
      description: Список пользователей, которым предложена дружба
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  format: int64
                  example: 1
    '400':
      description: Некорректные входные данные
    '404':
      description: Пользователь не найден