get:
  tags:
    - Friendship
  operationId: getOutgoingOfferFriendships
  summary: Получить исходящие предложения дружбы
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid
        example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
  responses:
    '200':
      description: Список исходящих предложений дружбы
      content:
        application/json:
          schema:
            type: array
            items:
              title: OfferFriendshipResponse
              type: object
              required: [offerId, fromUserId, toUserId, status, createdAt]
              properties:
                offerId:
                  type: string
                  format: uuid
                  example: 'b1a2c3d4-e5f6-7890-abcd-ef1234567890'
                fromUserId:
                  type: string
                  format: uuid
                  example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
                toUserId:
                  type: string
                  format: uuid
                  example: '7c9e6679-7425-40de-944b-e07fc1f90ae7'
                status:
                  type: string
                  enum: [PENDING, ACCEPTED, REJECTED]
                  example: PENDING
                createdAt:
                  type: string
                  format: date-time
                  example: '2026-09-22T10:15:00Z'
    '400':
      description: Некорректные входные данные
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Bad Request }
              status: { type: integer, example: 400 }
              detail: { type: string, example: Некорректные входные данные }
              instance: { type: string, example: /api/offer-friendships/outgoing }
    '404':
      description: Пользователь не найден
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: No Such User }
              status: { type: integer, example: 404 }
              detail: { type: string, example: Пользователь не найден }
              instance: { type: string, example: /api/offer-friendships/outgoing }