get:
  summary: Получить список друзей пользователя
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
  responses:
    '200':
      description: Список друзей пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  format: int64
                  example: 1
    '400':
      description: Некорректные входные данные
    '404':
      description: Пользователь не найден