get:
  tags:
    - Friendship
  operationId: getFriendships
  summary: Получить список друзей пользователя
  parameters:
    - name: userId
      in: query
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid
        example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
  responses:
    '200':
      description: Список друзей пользователя
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  format: uuid
                  example: '7c9e6679-7425-40de-944b-e07fc1f90ae7'
    '400':
      description: Некорректные входные данные
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Bad Request }
              status: { type: integer, example: 400 }
              detail: { type: string, example: Некорректные входные данные }
              instance: { type: string, example: /api/friendships }
    '404':
      description: Пользователь не найден
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: No Such User }
              status: { type: integer, example: 404 }
              detail: { type: string, example: Пользователь не найден }
              instance: { type: string, example: /api/friendships }