post:
  summary: Отклонить предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
  responses:
    '200':
      description: Предложение дружбы отклонено (статус → REJECTED)
      content:
        application/json:
          schema:
            type: object
    '204':
      description: Заявка уже в статусе REJECT
      content:
        application/json:
          schema:
            type: object
    '400':
      description: Некорректные входные данные
    '404':
      description: Заявка не найдена
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - instance
            properties:
              title:
                type: string
                example: No Friendship Exist
              status:
                type: integer
                example: 404
              detail:
                type: string
                example: Заявка не найдена
              instance:
                type: string
                example: /api/offer-friendships/reject
    '409':
      description: Заявка не в статусе PENDING
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - title
              - status
              - detail
              - instance
            properties:
              title:
                type: string
                example: Friendship wrong status
              status:
                type: integer
                example: 409
              detail:
                type: string
                example: Заявка в статусе ACCEPT
              instance:
                type: string
                example: /api/offer-friendships/reject