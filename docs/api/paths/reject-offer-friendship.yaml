post:
  tags:
    - Friendship
  operationId: rejectOfferFriendship
  summary: Отклонить предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - offerId
          properties:
            offerId:
              type: string
              format: uuid
              example: 'b1a2c3d4-e5f6-7890-abcd-ef1234567890'
  responses:
    '200':
      description: Предложение дружбы отклонено (статус → REJECTED)
    '204':
      description: Заявка уже в статусе REJECT
    '400':
      description: Некорректные входные данные
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Bad Request }
              status: { type: integer, example: 400 }
              detail: { type: string, example: Некорректные входные данные }
              instance: { type: string, example: /api/offer-friendships/reject }
    '404':
      description: Заявка не найдена
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: No Friendship Exist }
              status: { type: integer, example: 404 }
              detail: { type: string, example: Заявка не найдена }
              instance: { type: string, example: /api/offer-friendships/reject }
    '409':
      description: Заявка не в статусе PENDING
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Friendship wrong status }
              status: { type: integer, example: 409 }
              detail: { type: string, example: Заявка в статусе ACCEPT }
              instance: { type: string, example: /api/offer-friendships/reject }