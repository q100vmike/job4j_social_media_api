post:
  summary: Создать предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - fromUserId
            - toUserId
          properties:
            fromUserId:
              type: integer
              format: int64
              example: 1
            toUserId:
              type: integer
              format: int64
              example: 2
  responses:
    '201':
      description: Предложение дружбы создано
      content:
        application/json:
          schema:
            type: object
            required:
              - offerId
              - fromUserId
              - toUserId
              - status
              - createdAt
            properties:
              offerId:
                type: integer
                format: int64
                example: 10
              fromUserId:
                type: integer
                format: int64
                example: 1
              toUserId:
                type: integer
                format: int64
                example: 2
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: PENDING
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
    '204':
        description: |
            Заявка на дружбу уже существует в статусе PENDING или ACCEPTED —
            повторное создание не требуется.
    '400':
        description: Некорректные входные данные
    '404':
      description: Пользователь не найден
    '409':
      description: Предложение дружбы уже отклонено
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                example: OFFER_FRIENDSHIP_ALREADY_REJECTED
              message:
                type: string
                example: Отклонённое предложение дружбы нельзя создать повторно
