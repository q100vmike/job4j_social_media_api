post:
  tags:
    - Friendship
  operationId: createOfferFriendship
  summary: Создать предложение дружбы
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [fromUserId, toUserId]
          properties:
            fromUserId:
              type: string
              format: uuid
              example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
            toUserId:
              type: string
              format: uuid
              example: '7c9e6679-7425-40de-944b-e07fc1f90ae7'
  responses:
    '201':
      description: Предложение дружбы создано
      content:
        application/json:
          schema:
            title: CreateOfferFriendshipResponse
            type: object
            required: [offerId, fromUserId, toUserId, status, createdAt]
            properties:
              offerId:
                type: string
                format: uuid
                example: 'b1a2c3d4-e5f6-7890-abcd-ef1234567890'
              fromUserId:
                type: string
                format: uuid
                example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              toUserId:
                type: string
                format: uuid
                example: '7c9e6679-7425-40de-944b-e07fc1f90ae7'
              status:
                type: string
                enum: [PENDING, ACCEPTED, REJECTED]
                example: PENDING
              createdAt:
                type: string
                format: date-time
                example: '2026-09-22T10:15:00Z'
    '204':
      description: |
        Заявка на дружбу уже существует в статусе PENDING или ACCEPTED —
        повторное создание не требуется.
    '400':
      description: Некорректные входные данные
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Bad Request }
              status: { type: integer, example: 400 }
              detail: { type: string, example: Некорректные входные данные }
              instance: { type: string, example: /api/offer-friendships/create }
    '404':
      description: Целевой пользователь не найден
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: No Target User }
              status: { type: integer, example: 404 }
              detail: { type: string, example: Целевой пользователь не найден }
              instance: { type: string, example: /api/offer-friendships/create }
    '409':
      description: Заявка на дружбу уже существует в статусе REJECTED
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, detail, instance]
            properties:
              title: { type: string, example: Friendship wrong status }
              status: { type: integer, example: 409 }
              detail: { type: string, example: Заявка в статусе REJECT }
              instance: { type: string, example: /api/offer-friendships/create }